[package]
name = "hifzsdk"
version = "0.3.0"
edition = "2021"
description = "HifzSDK — Sabqi → Manzil Quran memorization SDK. Pick ONE file: HifzSDK.swift (Swift-only) or HifzSDK.rs (Rust-only). No server, no UI, no binary — it compiles INTO your app."
license = "MIT"

[lib]
name = "hifzsdk"
path = "src/lib.rs"

[[bin]]
name = "hifzsdk"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

